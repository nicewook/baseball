<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123a6b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>우진·우성 야구</title>
<style>
html,body{margin:0;height:100%;background:#0b1a33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:Pretendard,"Pretendard Variable","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* ---- in-game controls ---- */
.ctl{position:absolute;display:flex;gap:1.1em}
#pui{left:1.6em;bottom:1.6em;flex-direction:column;gap:.9em}
.row{display:flex;gap:1em}
.pt{width:8.4em;height:8.4em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a6fd8,#183d8a);border:.35em solid #fff;
  box-shadow:0 .4em 0 #0b2152,0 .6em 1.2em rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1em;line-height:1.1;transition:transform .08s}
.pt b{font-size:3.4em;line-height:1}
.pt span{font-size:1.25em;font-weight:800;margin-top:.15em;text-shadow:0 .1em 0 rgba(0,0,0,.4)}
.pt.on{background:radial-gradient(circle at 35% 30%,#ffd84a,#f08c00);border-color:#fff7c2;transform:scale(1.08);box-shadow:0 0 0 .35em rgba(255,216,74,.5),0 .4em 0 #8a4b00}
.pt.used{opacity:.35;filter:grayscale(1)}
.pt.magic{background:radial-gradient(circle at 35% 30%,#c36bff,#5a1aa8)}
.pt.magic.on{background:radial-gradient(circle at 35% 30%,#ffd84a,#f08c00)}
.pt.sm{width:7.2em;height:7.2em}.pt.sm b{font-size:2.9em}.pt.sm span{font-size:1.1em}
#mrow{padding:.6em;border-radius:5em;background:rgba(40,10,80,.55)}
#throw{position:absolute;right:2em;bottom:2em;width:17em;height:9em;border-radius:2em;background:linear-gradient(#ff6b5b,#d6332a);border:.4em solid #fff;
  font-size:1em;font-weight:900;box-shadow:0 .5em 0 #7d1610,0 .8em 1.4em rgba(0,0,0,.4)}
#throw span{font-size:3.2em}
#throw:disabled{filter:grayscale(1) brightness(.8);opacity:.6}
#bui{left:1.6em;bottom:1.6em}
.pw{width:9em;height:9em;border-radius:1.6em;background:rgba(20,30,60,.75);border:.35em solid rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pw b{font-size:3.6em;line-height:1}.pw span{font-size:1.5em;font-weight:900}
.pw.on{background:linear-gradient(#ffb02e,#f06a00);border-color:#fff;box-shadow:0 0 0 .35em rgba(255,176,46,.5)}
.pw.locked{opacity:.7}
#tbar{position:absolute;left:1em;top:1em;display:flex;gap:.8em}
.tb{width:5.2em;height:5.2em;border-radius:50%;background:rgba(0,0,0,.45);font-size:1em;display:flex;align-items:center;justify-content:center}
.tb b{font-size:2.4em}
/* ---- overlays ---- */
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;background:rgba(8,20,48,.86);text-align:center}
.ov.show{display:flex}
.ov h1{font-size:5.6em;margin:0;letter-spacing:.02em;text-shadow:0 .08em 0 #0006}
.ov h2{font-size:3.4em;margin:0}
.ov p{font-size:1.9em;margin:0;opacity:.92}
.big{font-size:1em;padding:1em 2.4em;border-radius:1.4em;background:linear-gradient(#4f8cff,#2a5ed8);border:.3em solid #fff;font-weight:900;box-shadow:0 .4em 0 #173a8a}
.big span{font-size:2.3em}
.big.g{background:linear-gradient(#4fd17e,#1f9e52);box-shadow:0 .4em 0 #0e5c2e}
.big.o{background:linear-gradient(#ffb02e,#f06a00);box-shadow:0 .4em 0 #8a3c00}
.big.p{background:linear-gradient(#c36bff,#7a2ed8);box-shadow:0 .4em 0 #431784}
.big.gray{background:linear-gradient(#7d8799,#566074);box-shadow:0 .4em 0 #2e3542}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}
.who{display:flex;gap:3em;align-items:center}
.face{width:11em;height:11em;border-radius:50%;background:#fff center/cover no-repeat;border:.5em solid rgba(255,255,255,.35);position:relative;font-size:1em}
.face.on{border-color:#ffd84a;box-shadow:0 0 0 .5em rgba(255,216,74,.45);transform:scale(1.06)}
.face i{position:absolute;left:0;right:0;bottom:-2.1em;font-style:normal;font-size:1.9em;font-weight:900}
.opts{display:flex;gap:1em;align-items:center;font-size:1.6em}
.chip{font-size:1em;padding:.4em 1em;border-radius:2em;background:rgba(255,255,255,.15);border:.12em solid rgba(255,255,255,.4)}
.chip.on{background:#ffd84a;color:#3a2600;border-color:#fff}
#codeBig{font-size:12em;font-weight:900;letter-spacing:.12em;background:#fff;color:#123a6b;border-radius:.15em;padding:0 .3em;line-height:1.25}
#jdisp{display:flex;gap:1em}
#jdisp div{width:2.2em;height:2.6em;border-radius:.3em;background:#fff;color:#123a6b;font-size:4em;font-weight:900;display:flex;align-items:center;justify-content:center}
#keys{display:grid;grid-template-columns:repeat(3,7.5em);gap:.9em}
#keys button{height:5.6em;border-radius:1em;background:rgba(255,255,255,.15);border:.2em solid rgba(255,255,255,.4);font-size:1em}
#keys button span{font-size:2.8em;font-weight:900}
#keys .ok{background:#2fbf6b}
.err{color:#ffb3b3;font-size:1.8em!important;min-height:1.3em}
.line{border-collapse:collapse;font-size:2em;margin:.3em 0}
.line td,.line th{border:.06em solid rgba(255,255,255,.35);padding:.15em .7em;min-width:1.6em}
#ovFace{width:16em;height:16em}
.crown{position:absolute;left:50%;top:-4.6em;transform:translateX(-50%);font-size:4em!important;bottom:auto!important}
#netbad{position:absolute;left:50%;top:13em;transform:translateX(-50%);background:#d6332a;padding:.6em 1.4em;border-radius:2em;font-size:1.6em;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="pui" class="ctl hidden">
    <div id="mrow" class="row hidden"></div>
    <div id="prow" class="row"></div>
  </div>
  <button id="throw" class="hidden" disabled><span>던지기!</span></button>
  <div id="bui" class="ctl hidden">
    <button class="pw" data-p="power"><b>⚡</b><span>세게</span></button>
    <button class="pw on" data-p="light"><b>🪶</b><span>가볍게</span></button>
  </div>
  <div id="tbar"><button class="tb" id="bHome" title="처음으로"><b>⏏</b></button><button class="tb" id="bSnd" title="소리"><b>🔊</b></button></div>
  <div id="netbad" class="hidden">상대 패드 연결이 끊겼어요… 기다리는 중</div>

  <div class="ov show" id="ovTitle">
    <h1>⚾ 우진·우성 야구</h1>
    <p>나는 누구?</p>
    <div class="who"><button class="face" id="me0"><i>우진</i></button><button class="face" id="me1"><i>우성</i></button></div>
    <div style="height:1.6em"></div>
    <div class="menu">
      <button class="big" id="goCpu"><span>🤖 컴퓨터랑</span></button>
      <button class="big g" id="goHot"><span>📱 패드 1대로 둘이</span></button>
      <button class="big o" id="goMake"><span>🌐 방 만들기</span></button>
      <button class="big p" id="goJoin"><span>🔢 방 들어가기</span></button>
    </div>
    <div class="opts">공 속도 <button class="chip" data-sp="1">보통</button><button class="chip" data-sp="1.3">느리게</button></div>
  </div>

  <div class="ov" id="ovWait">
    <p>방 번호</p>
    <div id="codeBig">----</div>
    <p id="waitMsg">다른 패드에서 「🔢 방 들어가기」를 누르고 이 번호를 넣어요</p>
    <button class="big gray" id="waitCancel"><span>취소</span></button>
  </div>

  <div class="ov" id="ovJoin">
    <p>방 번호 네 자리를 넣어요</p>
    <div id="jdisp"><div></div><div></div><div></div><div></div></div>
    <p class="err" id="jerr"></p>
    <div id="keys"></div>
    <button class="big gray" id="joinCancel"><span>취소</span></button>
  </div>

  <div class="ov" id="ovCover">
    <h2 id="coverT">타자 준비!</h2>
    <p id="coverS">준비되면 화면을 눌러요</p>
  </div>

  <div class="ov" id="ovOver">
    <div class="face" id="ovFace"><i class="crown">👑</i></div>
    <div style="height:.6em"></div>
    <h1 id="ovWin">우진 승리!</h1>
    <table class="line" id="ovLine"></table>
    <div class="menu">
      <button class="big g" id="again"><span>🔁 다시 하기</span></button>
      <button class="big gray" id="toTitle"><span>처음으로</span></button>
    </div>
  </div>
</div>

<script src="faces.local.js"></script>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ===== stage ===== */
const stage=$('stage'), cv=$('cv'), ctx=cv.getContext('2d'); let SC=1;
function resize(){
  const w=Math.min(innerWidth,innerHeight*1.6), h=w/1.6;
  stage.style.width=w+'px'; stage.style.height=h+'px'; stage.style.fontSize=(w/100)+'px';
  const d=Math.min(devicePixelRatio||1,2.5); cv.width=Math.round(w*d); cv.height=Math.round(h*d); SC=cv.width/W;
}
addEventListener('resize',resize); resize();
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }

/* ===== geometry ===== */
const MOUND={x:797,y:404}, PITCH_H=168;
const R={x:775,y:306};                 // release point (pitcher hand)
const ZC={x:800,y:650}, CW=88, CH=90;  // strike zone centre, cell size
const BAT={x:425,y:1012,h:560};
const cellXY=(i,j)=>({x:ZC.x+i*CW,y:ZC.y+j*CH});
const inZone=p=>Math.abs(p.i)<=1&&Math.abs(p.j)<=1;

/* ===== pitches ===== */
const PT={
  fast:{name:'빠른공',icon:'🔥',T:.85,arc:30},
  slow:{name:'느린공',icon:'🐢',T:1.5,arc:150},
  curve:{name:'커브',icon:'↩️',T:1.15,arc:60},
};
const MAGIC={
  spiral:{name:'회오리공',icon:'🌀',T:1.3,say:'회오리 공!'},
  tiny:{name:'꼬마공',icon:'🔍',T:1.0,say:'꼬마 공!'},
  ghost:{name:'유령공',icon:'👻',T:1.15,say:'유령 공!'},
  thunder:{name:'번개공',icon:'⚡',T:1.45,say:'번개 공!'},
};
let SPEED=parseFloat(localStorage.getItem('bb_speed')||'1');
function pitchT(p){ return (p.type==='magic'?MAGIC[p.magic].T:PT[p.type].T)*SPEED; }
function prog(p,tau,T){
  if(p.magic==='thunder'){ const a=T*.345,b=T*.655; if(tau<a) return .45*tau/a; if(tau<b) return .45; return Math.min(1,.45+.55*(tau-b)/(T-b)); }
  return Math.min(1,Math.max(0,tau/T));
}
// screen position of the ball tau seconds after release
function ballAt(p,tau,T){
  const t=prog(p,tau,T), P=cellXY(p.i,p.j), s=1/(1+8*(1-t));
  let x=R.x+(P.x-R.x)*t*s, y=R.y+(P.y-R.y)*t*s;
  const arc=p.type==='magic'?60:PT[p.type].arc; y-=arc*4*t*(1-t);
  let r=Math.max(3.5,30*s), a=1;
  if(p.type==='curve'){ const k=ss(0,.3,t)*(1-ss(.45,1,t)); x+=p.cd*150*k; y-=120*k; }
  if(p.magic==='spiral'){ const A=130*Math.pow(1-t,1.1)*ss(0,.1,t), th=t*5*Math.PI; x+=Math.cos(th)*A; y+=Math.sin(th)*A; }
  if(p.magic==='tiny') r*=lerp(1,.32,ss(.2,.9,t));
  if(p.magic==='ghost'){ const g=ss(.25,.35,t)*(1-ss(.78,.88,t)); a=1-g; if(g>.5 && Math.sin(tau*55)>.9) a=.45; }
  if(p.magic==='thunder' && t===.45){ x+=rnd(-4,4); y+=rnd(-4,4); }
  return {x,y,r,a,t,s};
}

/* ===== rules ===== */
const other=s=>s==='A'?'B':'A';
const batSeat=st=>st.half==='top'?st.first:other(st.first);
const pitSeat=st=>other(batSeat(st));
const COLOR={A:'blue',B:'red'};
const INN=3, MAX_INN=6, RUN_CAP=5;
function newState(first,names){ return {v:0,inning:1,half:'top',outs:0,balls:0,strikes:0,bases:[0,0,0],score:{A:0,B:0},line:{A:[],B:[]},first,names,magicUsed:false,halfRuns:0,over:null}; }

const WIN={light:{t:[.07,.155,.26],l:[.55,1.05,1.6]}, power:{t:[.05,.105,.21],l:[.42,.82,1.35]}};
function judge(p,sw){
  if(!sw) return {oc:inZone(p)?'strike':'ball'};
  const w=WIN[sw.power], at=Math.abs(sw.dt), d=Math.hypot(sw.dx,sw.dy);
  const tq=at<w.t[0]?2:at<w.t[1]?1:at<w.t[2]?0:-1;
  const lq=d<w.l[0]?2:d<w.l[1]?1:d<w.l[2]?0:-1;
  if(tq<0||lq<0) return {oc:'miss',tq,lq};
  const ang=clamp(sw.dt/w.t[1],-1.5,1.5)*28+rnd(-8,8);
  if(tq===0||lq===0) return {oc:'foul',tq,lq,ang:(sw.dt<0?-1:1)*rnd(55,80)};
  const q=tq+lq, r=Math.random(); let oc;
  if(sw.power==='power') oc= q===4?(r<.85?'HR':'3B') : q===3?(r<.5?'2B':r<.65?'3B':'FO') : (r<.65?'FO':'1B');
  else oc= q===4?(r<.7?'2B':'1B') : q===3?(r<.72?'1B':'GO') : (r<.3?'GO':r<.55?'FO':'1B');
  return {oc,tq,lq,q,ang:clamp(ang,-40,40)};
}

// apply an outcome to a copy of the state; returns {st, ev}
function apply(st0,oc,p){
  const st=JSON.parse(JSON.stringify(st0));
  const ev={oc,runs:0,pa:false,half:false,over:false,call:'',moves:[],halfWhy:''};
  const bat=batSeat(st), home=other(st.first);
  if(p&&p.type==='magic') st.magicUsed=true;
  const score=n=>{ if(!n) return; st.score[bat]+=n; const L=st.line[bat]; while(L.length<st.inning) L.push(0); L[st.inning-1]+=n; st.halfRuns+=n; ev.runs+=n; };
  const b=st.bases;
  const mv=(f,t)=>ev.moves.push({f,t});
  switch(oc){
    case 'ball': st.balls++; ev.call='볼';
      if(st.balls>=4){ ev.call='볼넷'; ev.pa=true; let r=0;
        if(b[0]){ if(b[1]){ if(b[2]){ r++; mv(3,4);} mv(2,3); b[2]=1;} mv(1,2); b[1]=1; }
        b[0]=1; mv(0,1); score(r); }
      break;
    case 'strike': case 'miss': st.strikes++; ev.call=oc==='miss'?'헛스윙':'스트라이크';
      if(st.strikes>=3){ st.outs++; ev.call='삼진 아웃'; ev.pa=true; ev.k=true; } break;
    case 'foul': if(st.strikes<2) st.strikes++; ev.call='파울'; break;
    case '1B': { let r=0; const nb=[1,0,0];
      if(b[2]){r++;mv(3,4);} if(b[1]){r++;mv(2,4);} if(b[0]){nb[1]=1;mv(1,2);} mv(0,1);
      st.bases=nb; score(r); ev.call='안타'; ev.pa=true; break; }
    case '2B': case '3B': case 'HR': { const k={'2B':2,'3B':3,'HR':4}[oc]; let r=0; const nb=[0,0,0];
      for(let i=2;i>=0;i--) if(b[i]){ const to=i+1+k; if(to>=4){r++;mv(i+1,4);} else {nb[to-1]=1;mv(i+1,to);} }
      if(k>=4){r++;mv(0,4);} else {nb[k-1]=1;mv(0,k);}
      st.bases=nb; score(r); ev.call={'2B':'2루타','3B':'3루타','HR':'홈런'}[oc]; ev.pa=true; break; }
    case 'GO': st.outs++; ev.call='땅볼 아웃'; ev.pa=true; mv(0,-1);
      if(st.outs<3 && b[0]){ let r=0; if(b[1]){ if(b[2]){r++;mv(3,4);} mv(2,3); b[2]=1;} mv(1,2); b[1]=1; b[0]=0; score(r); }
      break;
    case 'FO': st.outs++; ev.call='뜬공 아웃'; ev.pa=true; mv(0,-1);
      if(st.outs<3 && b[2]){ b[2]=0; mv(3,4); score(1); ev.sac=true; }
      break;
  }
  if(ev.pa){ st.balls=0; st.strikes=0; st.magicUsed=false; }
  const lead=()=>st.score[home]-st.score[st.first];
  if(st.half==='bot' && st.inning>=INN && lead()>0){ ev.over=true; }
  else if(st.outs>=3 || st.halfRuns>=RUN_CAP){
    ev.half=true; ev.halfWhy=st.outs>=3?'3아웃':`${RUN_CAP}점`;
    const L=st.line[bat]; while(L.length<st.inning) L.push(0);
    if(st.half==='top'){ if(st.inning>=INN && lead()>0) ev.over=true; else st.half='bot'; }
    else { if(st.inning>=INN && lead()!==0) ev.over=true; else if(st.inning>=MAX_INN) ev.over=true; else { st.inning++; st.half='top'; } }
    st.outs=0; st.balls=0; st.strikes=0; st.bases=[0,0,0]; st.halfRuns=0; st.magicUsed=false;
  }
  if(ev.over){ const d=st.score.A-st.score.B; st.over={winner:d>0?'A':d<0?'B':'draw'}; }
  st.v++;
  return {st,ev};
}

const AU={ctx:null,on:localStorage.getItem('bb_snd')!=='0',noise:null};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const a=AU.ctx=new C(); AU.master=a.createGain(); AU.master.gain.value=AU.on?.9:0; AU.master.connect(a.destination);
  const comp=a.createDynamicsCompressor(); comp.connect(AU.master); AU.out=comp;
  const len=a.sampleRate*1.5, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=buf;
  AU.bgm=a.createGain(); AU.bgm.gain.value=0; AU.bgm.connect(AU.out);
}
const T0=()=>AU.ctx.currentTime;
function tone(f0,f1,dur,{type='sine',vol=.3,at=0,attack=.005,dest}={}){
  if(!AU.ctx) return null; const a=AU.ctx,o=a.createOscillator(),g=a.createGain(),t=T0()+at;
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(dest||AU.out);o.start(t);o.stop(t+dur+.05);return o;
}
function noise(dur,{f0=1000,f1=f0,q=1,type='bandpass',vol=.3,at=0,attack=.005,dest}={}){
  if(!AU.ctx) return; const a=AU.ctx,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=T0()+at;
  s.buffer=AU.noise;s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(dest||AU.out);s.start(t,Math.random());s.stop(t+dur+.05);
}

      const l=this.lead[s%32]; if(l) tone(m(l),m(l),spb*.9,{type:'square',vol:.035,at,dest:AU.bgm});

/* ===== game state ===== */
const G={vs:null,me:'A',st:null,phase:'idle',sel:{type:null,magic:null,i:null,j:null},power:'light',fl:null,view:'plate',play:null,
  parts:[],texts:[],banner:null,cameo:null,flash:0,shake:0,epoch:0,peer:true,hint:''};
const isCPU=seat=>G.vs==='cpu'&&seat==='B';
const isLocal=seat=>G.vs==='hot'||(G.vs==='cpu'&&seat==='A')||(G.vs==='net'&&seat===G.me);
const nameOf=seat=>G.st.names[seat];
function later(sec,fn){ const e=G.epoch; setTimeout(()=>{ if(e===G.epoch) fn(); },sec*1000); }

/* ===== flow ===== */
function startGame(st){
  G.epoch++; G.st=st; G.view='plate'; G.play=null; G.fl=null; G.parts=[]; G.texts=[]; G.cameo=null;
  hideOv(); audioInit(); BGM.start(); loadFaces();
  const fb=batSeat(st);
  SFX.coin(); setBanner(`${nameOf(fb)} 먼저 공격!`,'#ffd84a',2); say(`${nameOf(fb)} 먼저 공격!`);
  later(2.1,startPick);
}
function startPick(){
  const st=G.st; G.phase='pick'; G.fl=null; G.swing=null; G.res=null; G.sel={type:null,magic:null,i:null,j:null};
  const ps=pitSeat(st), bs=batSeat(st);
  buildPitchUI();
  $('pui').classList.toggle('hidden',!(isLocal(ps)));
  $('throw').classList.toggle('hidden',!(isLocal(ps)));
  const showBat=isLocal(bs)&&!(G.vs==='hot');
  $('bui').classList.toggle('hidden',!showBat); lockPower(false);
  updThrow();
  if(isCPU(ps)){ G.hint=''; later(rnd(1.1,1.8),()=>throwPitch(cpuPitch())); }
  if(G.vs==='hot') G.hint=`투수 ${nameOf(ps)} 차례 · ${nameOf(bs)}는 눈 감기 🙈`;
  else if(isLocal(ps)) G.hint='① 공 고르기 → ② 칸 누르기 → ③ 던지기!';
  else G.hint='투수가 공을 고르는 중… 세게 칠지 가볍게 칠지 골라요';
}
function throwPitch(p){
  if(G.phase!=='pick') return;
  p.id=Math.random().toString(36).slice(2,8);
  G.phase='sent'; $('pui').classList.add('hidden'); $('throw').classList.add('hidden'); G.hint='';
  if(G.vs==='net'){ Net.send({t:'pitch',p,v:G.st.v}); beginFlight(p); }
  else if(G.vs==='hot'){ showCover(`${nameOf(batSeat(G.st))} 준비!`,'화면을 누르면 시작해요. 공이 오기 전에 세게/가볍게를 골라요',()=>{ $('bui').classList.remove('hidden'); G.hint='세게/가볍게 고르고… 공이 오면 공을 눌러요!'; later(2,()=>beginFlight(p)); }); }
  else beginFlight(p);
}
function beginFlight(p){
  const bs=batSeat(G.st);
  G.phase='flight'; G.hint='';
  const wind=.75;
  G.fl={p,T:pitchT(p),t0:now()+wind*1000,owner:G.vs!=='net'||bs===G.me,human:isLocal(bs)&&!isCPU(bs),cpu:isCPU(bs)?cpuSwing(p):null,done:false,trail:[]};
  lockPower(true);
  SFX.windup(); SFX.whoosh(G.fl.T+wind);
  if(p.type==='magic'){ later(wind,()=>{ SFX.magic(p.magic); setBanner(`${MAGIC[p.magic].icon} ${MAGIC[p.magic].name}!`,'#d79bff',1.1,96); say(MAGIC[p.magic].say,{rate:1.3,pitch:1.4}); }); SFX.charge(); }
}
function arrival(){ return G.fl.t0+G.fl.T*1000; }
function doSwing(sw,tapPt){
  const fl=G.fl; if(!fl||G.swing) return;
  G.swing={...sw,at:now()}; SFX.swish();
  const res=judge(fl.p,sw); G.res=res;
  const contact=res.oc!=='miss';
  if(contact){ launch(res); }
  if(tapPt) G.parts.push({t:'ring',x:tapPt.x,y:tapPt.y,r:10,life:.35,max:.35,color:contact?'#ffd84a':'#fff'});
  if(fl.owner) later(contact?.75:.9,()=>resolve(res));
}
function launch(res){
  const fl=G.fl, tau=(now()-fl.t0)/1000, b=ballAt(fl.p,Math.max(0,tau),fl.T);
  fl.hit={x:b.x,y:b.y,r:b.r,t:now(),vx:res.oc==='foul'?Math.sign(res.ang)*1600:Math.sin(res.ang*Math.PI/180)*1500,vy:res.oc==='GO'?-500:-1500};
  SFX.crack(G.swing&&G.swing.power==='power'&&res.q>=3);
  if(res.oc==='foul') SFX.foul();
  G.flash=res.q===4?.25:.12; G.shake=res.q===4?14:6;
  spark(b.x,b.y,'#fff7c2',res.q===4?40:18);
}
function resolve(res){
  if(!G.fl||G.fl.done) return; G.fl.done=true;
  const {st,ev}=apply(G.st,res.oc,G.fl.p);
  const sw=G.swing?{dt:G.swing.dt,dx:G.swing.dx,dy:G.swing.dy,power:G.swing.power}:null;
  const m={t:'result',res,sw,ev,state:st,pv:G.st.v};
  if(G.vs==='net') Net.send(m);
  showResult(m);
}
function showResult(m){
  G.phase='result'; const ev=m.ev, oc=m.res.oc; G.lastEv=ev;
  $('bui').classList.add('hidden');
  const inPlay=['1B','2B','3B','HR','GO','FO'].includes(oc);
  if(inPlay){ later(.55,()=>{ G.view='field'; G.play=makePlay(m); }); later(.55+G.playDur(m),()=>finish(m)); }
  else {
    const col={'볼':'#7fe0a0','볼넷':'#7fe0a0','스트라이크':'#ffd84a','헛스윙':'#ffd84a','파울':'#ffb02e','삼진 아웃':'#ff6b5b'}[ev.call]||'#fff';
    setBanner(ev.call+'!',col,1.2, ev.k?130:110);
    say(ev.call+'!');
    if(ev.k){ SFX.k(); showCameo(pitSeat(G.st),'삼진!'); }
    if(ev.call==='볼넷'){ SFX.organ(); if(ev.runs){ addText(`+${ev.runs}점!`,800,300,'#ffd84a',90); SFX.score(); } }
    if(oc==='miss') SFX.aww();
    later(ev.k?1.9:1.35,()=>finish(m));
  }
}
function finish(m){
  G.st=m.state; G.view='plate'; G.play=null; G.fl=null;

function cpuPitch(){
  const st=G.st, r=Math.random();
  const p={type:r<.4?'fast':r<.7?'slow':'curve',magic:null,i:0,j:0,cd:Math.random()<.5?-1:1};
  if(!st.magicUsed && Math.random()<(st.strikes===2?.45:.15)){ p.type='magic'; p.magic=Object.keys(MAGIC)[Math.random()*4|0]; }
  if(Math.random()<.72){ p.i=(Math.random()*3|0)-1; p.j=(Math.random()*3|0)-1; }
  else { do{ p.i=(Math.random()*5|0)-2; p.j=(Math.random()*5|0)-2; }while(inZone(p)); }

}
function cpuSwing(p){
  if(Math.random()>(inZone(p)?.78:.28)) return null;
  let st=.11, sl=.55, bias=0;
  if(p.type==='fast') st=.13; if(p.type==='slow'){bias=-.06;st=.12;} if(p.type==='curve') sl=.75;
  if(p.type==='magic'){ st=.14; sl=.85; if(p.magic==='thunder') bias=-.1; }
  return {dt:bias+gauss()*st, dx:gauss()*sl, dy:gauss()*sl, power:Math.random()<.4?'power':'light'};
}

function makePlay(m){
  const oc=m.res.oc; let ang=m.res.ang||0;
  const dist={GO:rnd(215,265),FO:rnd(450,560),'1B':rnd(370,430),'2B':rnd(560,600),'3B':rnd(605,628),HR:rnd(740,800)}[oc];
  if(oc==='2B'||oc==='3B') ang=(Math.abs(ang)<8?(Math.random()<.5?-1:1)*rnd(16,24):ang);
  const a=ang*Math.PI/180, land={x:HOME.x+Math.sin(a)*dist,y:HOME.y-Math.cos(a)*dist};
  const bt=.5+dist/1000;
  let fi=0,best=1e9; FIELDERS.forEach((f,i)=>{ if(i===1) return; const d=Math.hypot(f.x-land.x,f.y-land.y); if(d<best){best=d;fi=i;} });
  const peak={GO:0,FO:260,'1B':90,'2B':140,'3B':170,HR:320}[oc];
  const runners=m.ev.moves.map(mv=>({f:mv.f,t:mv.t}));
  SFX.cheer(1.2,.6);
  return {m,oc,land,bt,fi,peak,runners,t0:now(),called:false,
    color:COLOR[pitSeat(G.st)], rcolor:COLOR[batSeat(G.st)]};
}
function basePath(f,t,u){ // runner from base f to base t (t=-1: out at first), u in [0,1]
  if(t===-1){ const p=lerp(0,.85,u); return {x:lerp(BASES[0].x,BASES[1].x,p),y:lerp(BASES[0].y,BASES[1].y,p)}; }
  const n=t-f; if(n<=0) return BASES[f]; const seg=u*n, k=Math.min(n-1,Math.floor(seg)), w=seg-k;
  const A=BASES[f+k],B=BASES[f+k+1]; return {x:lerp(A.x,B.x,w),y:lerp(A.y,B.y,w)};
}
function updatePlay(){
  const P=G.play; if(!P) return; const e=(now()-P.t0)/1000;
  if(!P.called && e>=P.bt*(P.oc==='HR'?.75:1)){
    P.called=true; const ev=P.m.ev;
    const col={HR:'#ffd84a','3B':'#ff9f1c','2B':'#ff9f1c','1B':'#7fe0a0',GO:'#ff6b5b',FO:'#ff6b5b'}[P.oc];

    if(P.oc==='HR'){ SFX.homer(); fireworks(); showCameo(batSeat(G.st),'홈런!',1.8); G.shake=10; }

  // bases mini
  const mx=1530,my=88; for(let i=0;i<3;i++){ const pos=[[mx+26,my],[mx,my-26],[mx-26,my]][i]; ctx.save(); ctx.translate(pos[0],pos[1]); ctx.rotate(Math.PI/4);
    ctx.fillStyle=st.bases[i]?'#ffd84a':'rgba(255,255,255,.2)'; ctx.fillRect(-12,-12,24,24); ctx.restore(); }
  // magic
  ctx.font='800 22px Pretendard,Malgun Gothic,sans-serif'; ctx.textAlign='center'; ctx.fillStyle=st.magicUsed?'rgba(255,255,255,.35)':'#e2b3ff';
  ctx.fillText(st.magicUsed?'★ 마구 사용함':'★ 마구 남음',1435,146);
  ctx.restore();
}
function drawFx(dt){
  for(const q of G.parts){ q.life-=dt; q.x+=q.vx?q.vx*dt:0; q.y+=q.vy?q.vy*dt:0;
    if(q.t==='spark'){ q.vy+=1200*(q.grav||1)*dt; q.vx*=.97; }
    if(q.t==='conf'){ q.rot+=q.vr*dt; q.vx+=Math.sin(now()/300+q.size)*20*dt; }
    if(q.t==='ring') q.r+=500*dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.parts){ const a=clamp(q.life/q.max,0,1);
    if(q.t==='spark'){ ctx.globalAlpha=a; ctx.fillStyle=q.color; ctx.beginPath(); ctx.arc(q.x,q.y,q.size*a+1,0,Math.PI*2); ctx.fill(); }
    else if(q.t==='conf'){ ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot); ctx.fillStyle=q.color; ctx.fillRect(-q.size/2,-q.size/4,q.size,q.size/2); ctx.restore(); }
    else if(q.t==='ring'){ ctx.globalAlpha=a; ctx.strokeStyle=q.color; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,Math.PI*2); ctx.stroke(); }
  }
  ctx.globalAlpha=1;
  for(const t of G.texts){ t.life-=dt; t.y+=t.vy*dt; const a=clamp(t.life/t.max*2,0,1);
    ctx.globalAlpha=a; ctx.font=`900 ${t.size}px Pretendard,Malgun Gothic,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=10; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(t.text,t.x,t.y); ctx.fillStyle=t.color; ctx.fillText(t.text,t.x,t.y); }
  G.texts=G.texts.filter(t=>t.life>0); ctx.globalAlpha=1;
  const b=G.banner; if(b){ b.life-=dt; if(b.life<=0) G.banner=null; else {
    const k=b.max-b.life, sc=k<.15?lerp(.4,1.1,k/.15):k<.25?lerp(1.1,1,(k-.15)/.1):1, a=clamp(b.life/.25,0,1);
    ctx.save(); ctx.globalAlpha=a; ctx.translate(W/2,H*.42); ctx.scale(sc,sc);
    ctx.font=`900 ${b.size}px Pretendard,Malgun Gothic,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=b.size*.16; ctx.strokeStyle='rgba(10,20,40,.85)'; ctx.lineJoin='round'; ctx.strokeText(b.text,0,0); ctx.fillStyle=b.color; ctx.fillText(b.text,0,0); ctx.restore(); } }
  const c=G.cameo; if(c){ c.life-=dt; if(c.life<=0) G.cameo=null; else {
    const k=c.max-c.life, pop=k<.2?k/.2:c.life<.2?c.life/.2:1, x=batSeat(G.st)===c.seat?250:1350;
    ctx.save(); ctx.translate(x,560); ctx.scale(pop,pop); portrait(c.seat,0,0,130);
    ctx.fillStyle='#fff'; rr(-130,150,260,70,35); ctx.fill(); ctx.fillStyle='#d6332a'; ctx.font='900 44px Pretendard,Malgun Gothic,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(c.text,0,186);
    ctx.restore(); } }
  if(G.flash>0){ ctx.fillStyle=`rgba(255,255,255,${G.flash*2})`; ctx.fillRect(0,0,W,H); G.flash-=dt; }
}
function drawHint(){
  if(!G.hint||G.phase==='over') return;
  ctx.save(); ctx.font='800 30px Pretendard,Malgun Gothic,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(G.hint).width+60; ctx.fillStyle='rgba(10,24,52,.78)'; rr(W/2-w/2,150,w,56,28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(G.hint,W/2,179); ctx.restore();
}
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  ctx.setTransform(SC,0,0,SC,0,0);
  if(G.shake>0){ ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake)); G.shake=Math.max(0,G.shake-60*dt); }
  if(G.view==='field') { drawField(); updatePlay(); } else drawPlate();
  if(G.st) hud();
  drawHint();
  drawFx(dt);
  tickFlight();
  requestAnimationFrame(loop);
}
function tickFlight(){
  const fl=G.fl; if(!fl||G.phase!=='flight'||G.swing) return;
  const t=now(), A=arrival();
  if(fl.cpu && t>=A+fl.cpu.dt*1000){ const P=cellXY(fl.p.i,fl.p.j); doSwing(fl.cpu,{x:P.x+fl.cpu.dx*CW,y:P.y+fl.cpu.dy*CH}); return; }
  if(fl.owner && !fl.done && t>A+380){ fl.done=false; G.swing=null; resolve(judge(fl.p,null)); }
}

/* ===== input ===== */
cv.addEventListener('pointerdown',e=>{
  audioInit(); const pt=toGame(e);
  if(G.phase==='pick'){ const ps=pitSeat(G.st); if(!isLocal(ps)||isCPU(ps)) return;
    const i=Math.round((pt.x-ZC.x)/CW), j=Math.round((pt.y-ZC.y)/CH);
    if(Math.abs(i)<=2&&Math.abs(j)<=2){ G.sel.i=i; G.sel.j=j; SFX.select(); updThrow(); }
    return; }
  if(G.phase==='flight' && G.fl && G.fl.human && !G.swing){
    const ts=e.timeStamp&&e.timeStamp>1e3?e.timeStamp:now();
    if(ts<G.fl.t0) return;                 // before release: ignore
    const P=cellXY(G.fl.p.i,G.fl.p.j);
    doSwing({dt:(ts-arrival())/1000,dx:(pt.x-P.x)/CW,dy:(pt.y-P.y)/CH,power:G.power},pt);
  }
});
function buildPitchUI(){
  const st=G.st, row=$('prow'), mrow=$('mrow');
  row.innerHTML=''; mrow.innerHTML=''; mrow.classList.add('hidden');
  for(const [k,v] of Object.entries(PT)){ const b=document.createElement('button'); b.className='pt'; b.dataset.t=k; b.innerHTML=`<b>${v.icon}</b><span>${v.name}</span>`;
    b.onclick=()=>{ audioInit(); SFX.click(); G.sel.type=k; G.sel.magic=null; mrow.classList.add('hidden'); refreshPT(); }; row.appendChild(b); }
  const mb=document.createElement('button'); mb.className='pt magic'+(st.magicUsed?' used':''); mb.dataset.t='magic'; mb.innerHTML='<b>⭐</b><span>마구</span>';
  mb.onclick=()=>{ audioInit(); if(G.st.magicUsed){ SFX.out(); return; } SFX.charge(); mrow.classList.toggle('hidden'); }; row.appendChild(mb);
  for(const [k,v] of Object.entries(MAGIC)){ const b=document.createElement('button'); b.className='pt sm magic'; b.dataset.m=k; b.innerHTML=`<b>${v.icon}</b><span>${v.name}</span>`;
    b.onclick=()=>{ SFX.click(); G.sel.type='magic'; G.sel.magic=k; refreshPT(); }; mrow.appendChild(b); }
  refreshPT();
}
function refreshPT(){
  document.querySelectorAll('#prow .pt').forEach(b=>b.classList.toggle('on',b.dataset.t===G.sel.type));
  document.querySelectorAll('#mrow .pt').forEach(b=>b.classList.toggle('on',b.dataset.m===G.sel.magic));
  updThrow();
}
function updThrow(){ $('throw').disabled=!(G.sel.type&&G.sel.i!==null); }
$('throw').onclick=()=>{ if($('throw').disabled) return; audioInit(); const s=G.sel;
  throwPitch({type:s.type,magic:s.magic,i:s.i,j:s.j,cd:s.i>0?1:s.i<0?-1:(Math.random()<.5?-1:1)}); };
document.querySelectorAll('.pw').forEach(b=>b.onclick=()=>{ if(b.classList.contains('locked')) return; audioInit(); SFX.click(); G.power=b.dataset.p; refreshPower(); });
function refreshPower(){ document.querySelectorAll('.pw').forEach(b=>b.classList.toggle('on',b.dataset.p===G.power)); }
function lockPower(on){ document.querySelectorAll('.pw').forEach(b=>b.classList.toggle('locked',on)); }

/* ===== overlays ===== */
function showOv(id){ document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('show',o.id===id)); }
function hideOv(){ document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show')); }
let coverCb=null;
function showCover(t,s,cb){ $('coverT').textContent=t; $('coverS').textContent=s; coverCb=cb; showOv('ovCover'); }
$('ovCover').addEventListener('pointerdown',()=>{ audioInit(); if(!coverCb) return; const cb=coverCb; coverCb=null; hideOv(); SFX.click(); cb(); });

let ME=localStorage.getItem('bb_me')||'우진';
function refreshTitle(){
  ['me0','me1'].forEach((id,k)=>{ const n=NAMES[k], el=$(id); el.style.backgroundImage=faceCss(n,k?'red':'blue'); el.classList.toggle('on',n===ME); });
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',parseFloat(c.dataset.sp)===SPEED));
}
['me0','me1'].forEach((id,k)=>$(id).onclick=()=>{ audioInit(); SFX.click(); ME=NAMES[k]; localStorage.setItem('bb_me',ME); refreshTitle(); });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ SFX.click(); SPEED=parseFloat(c.dataset.sp); localStorage.setItem('bb_speed',SPEED); refreshTitle(); });
const otherName=n=>n===NAMES[0]?NAMES[1]:NAMES[0];
$('goCpu').onclick=()=>{ G.vs='cpu'; G.me='A'; startGame(newState(Math.random()<.5?'A':'B',{A:ME,B:'로봇'})); };
$('goHot').onclick=()=>{ G.vs='hot'; G.me='A'; startGame(newState(Math.random()<.5?'A':'B',{A:ME,B:otherName(ME)})); };
$('goMake').onclick=async()=>{ audioInit(); G.vs='net'; $('codeBig').textContent='----'; $('waitMsg').textContent='방을 만드는 중…'; showOv('ovWait');
  try{ await Net.create(); $('codeBig').textContent=Net.code; $('waitMsg').textContent='다른 패드에서 「🔢 방 들어가기」를 누르고 이 번호를 넣어요'; }
  catch(e){ $('waitMsg').textContent='서버에 연결하지 못했어요. 인터넷을 확인해 주세요'; } };
$('waitCancel').onclick=()=>{ Net.close(); toTitle(); };
let jcode='';
function refreshJ(){ [...$('jdisp').children].forEach((d,i)=>d.textContent=jcode[i]||''); }
(function(){ const k=$('keys'); ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(c=>{ const b=document.createElement('button'); b.innerHTML=`<span>${c}</span>`; if(c==='✓') b.className='ok';
  b.onclick=async()=>{ SFX.click(); $('jerr').textContent='';
    if(c==='⌫') jcode=jcode.slice(0,-1); else if(c==='✓'){ if(jcode.length!==4) return; G.vs='net';
      try{ await Net.join(jcode); $('jerr').textContent='연결됨! 시작을 기다리는 중…'; }catch(e){ $('jerr').textContent=e.message||'들어가지 못했어요'; } }
    else if(jcode.length<4) jcode+=c; refreshJ(); }; k.appendChild(b); }); })();
$('goJoin').onclick=()=>{ audioInit(); jcode=''; refreshJ(); $('jerr').textContent=''; showOv('ovJoin'); };
$('joinCancel').onclick=()=>{ Net.close(); toTitle(); };
$('again').onclick=()=>{ SFX.click();
  if(G.vs==='net'){ if(G.me==='A') netStart(); else { Net.send({t:'rematch'}); $('ovWin').textContent='상대를 기다리는 중…'; } }
  else startGame(newState(Math.random()<.5?'A':'B',G.st.names)); };
$('toTitle').onclick=()=>{ Net.close(); toTitle(); };
$('bHome').onclick=()=>{ if(G.phase!=='idle' && !confirm('경기를 그만하고 처음 화면으로 갈까요?')) return; Net.close(); toTitle(); };
$('bSnd').onclick=()=>{ audioInit(); AU.on=!AU.on; localStorage.setItem('bb_snd',AU.on?'1':'0'); if(AU.master) AU.master.gain.value=AU.on?.9:0; $('bSnd').innerHTML=`<b>${AU.on?'🔊':'🔇'}</b>`; if(!AU.on) speechSynthesis?.cancel(); };
$('bSnd').innerHTML=`<b>${AU.on?'🔊':'🔇'}</b>`;
function toTitle(){ G.epoch++; G.phase='idle'; G.st=null; G.fl=null; G.view='plate'; G.play=null; G.hint=''; G.vs=null; BGM.stop();
  ['pui','throw','bui','netbad'].forEach(id=>$(id).classList.add('hidden')); refreshTitle(); showOv('ovTitle'); }

/* ===== network ===== */
const Net={code:null,token:null,seat:null,es:null,peerName:null,
  async post(path,body){ const r=await fetch(SERVER+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'연결 오류'); return j; },
  async create(){ const j=await this.post('/room'); Object.assign(this,{code:j.code,token:j.token,seat:'A'}); G.me='A'; this.open(); },
  async join(code){ const j=await this.post('/join',{code}); Object.assign(this,{code,token:j.token,seat:'B'}); G.me='B'; this.open(); },
  open(){ if(this.es) this.es.close(); const es=this.es=new EventSource(`${SERVER}/events?code=${this.code}&token=${this.token}`);
    es.onmessage=e=>{ try{ onNet(JSON.parse(e.data)); }catch(err){ console.error(err); } }; },
  send(msg,tries=0){ if(!this.code) return; this.post('/send',{code:this.code,token:this.token,msg}).catch(()=>{ if(tries<5) setTimeout(()=>this.send(msg,tries+1),700); }); },
  close(){ if(this.es) this.es.close(); this.es=null; this.code=null; this.token=null; }
};
function netStart(){ const st=newState(Math.random()<.5?'A':'B',{A:ME,B:Net.peerName||otherName(ME)}); Net.send({t:'start',state:st}); startGame(st); }
function onNet(m){
  if(m.t==='hello'){ G.peer=m.peer; if(Net.seat==='B') Net.send({t:'name',name:ME});
    if(m.state&&G.st&&m.state.v>G.st.v){ G.st=m.state; startPick(); } return; }
  if(m.t==='peer'){ G.peer=m.on; $('netbad').classList.toggle('hidden',m.on||!G.st||G.phase==='over');
    if(m.on&&G.st&&G.me===batSeat(G.st)&&G.phase!=='flight'&&G.phase!=='result') Net.send({t:'sync',state:G.st}); return; }
  if(m.t==='name'){ Net.peerName=m.name; if(G.me==='A'&&!G.st) netStart(); return; }
  if(m.t==='start'){ startGame(m.state); return; }
  if(m.t==='rematch'){ if(G.me==='A') netStart(); return; }
  if(m.t==='sync'){ if(!G.st||m.state.v>=G.st.v){ G.epoch++; G.st=m.state; G.view='plate'; G.play=null; startPick(); } return; }
  if(m.t==='pitch'){ if(G.st&&m.v===G.st.v&&G.phase==='pick') beginFlight(m.p); return; }
  if(m.t==='result'){ if(!G.st||m.pv!==G.st.v) return;
    if(G.fl&&!G.swing&&m.sw){ G.swing={...m.sw,at:now()}; G.res=m.res; if(m.res.oc!=='miss') launch(m.res); else SFX.swish(); }
    if(G.fl) G.fl.done=true;
    later(m.sw?.35:0,()=>showResult(m)); return; }
}

/* ===== test hooks ===== */
window.BB={G,apply,judge,ballAt,newState,startGame,Net,cellXY,arrival:()=>arrival()};

loadAll().then(()=>{ refreshTitle(); requestAnimationFrame(loop); });
